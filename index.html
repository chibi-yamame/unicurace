<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unicurace - Single Player</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            overflow: hidden; /* スクロール禁止 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* スマホのアドレスバーの表示・非表示に追従 */
        }
        section {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        section.active { display: flex; }

        h1 { font-size: 2rem; margin-bottom: 1rem; color: var(--primary-color); }
        
        /* シード入力関連 */
        .seed-container { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .seed-input-group { display: flex; gap: 5px; }
        #title-seed-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 120px; text-align: center; font-size: 1.1rem; }
        .btn-small { padding: 8px 15px; font-size: 0.9rem; background-color: #6c757d; border-radius: 8px; }
        .seed-label { font-size: 0.9rem; color: #666; }
        #display-seed { font-weight: bold; color: var(--primary-color); margin-top: 5px; }

        .btn {
            padding: 15px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn:active { transform: scale(0.95); }

        /* カウントダウン */
        #countdown-text { font-size: 8rem; font-weight: bold; color: var(--primary-color); }

        /* ゲーム画面 */
        .game-header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .main-stats { width: 100%; display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 5px; }
        #game-canvas { background: white; border: 4px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 90vw; max-height: 90vw; }
        #penalty-timer { color: #ff4757; font-size: 0.9rem; font-weight: bold; min-height: 1.2em; }
        
        .system-controls { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .game-controls { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        .btn-system { padding: 8px 15px; font-size: 0.8rem; border-radius: 8px; background-color: #6c757d; color: white; border: none; cursor: pointer; }

        /* ペナルティポップアップ演出 */
        .penalty-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4757;
            font-size: 2.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            animation: penaltyFloat 1.0s ease-out forwards;
        }
        @keyframes penaltyFloat {
            0% { transform: translate(-50%, -50%); opacity: 1; }
            100% { transform: translate(-50%, -150%); opacity: 0; }
        }

        /* 結果画面 */
        #screen-result h2 { font-size: 2.5rem; margin-bottom: 30px; color: var(--primary-color); }
        .result-time { font-size: 3rem; font-weight: bold; color: var(--primary-color); margin: 20px 0; font-family: 'Courier New', monospace; }
        .result-stats { font-size: 1rem; margin: 20px 0; color: #666; }
        .result-buttons { display: flex; gap: 15px; margin-top: 30px; width: 100%; justify-content: center; }
        .result-buttons .btn { flex: 1; max-width: 200px; }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <section id="screen-title" class="active">
        <h1>Unicurace</h1>
        <p>一筆書き塗りつぶしパズル</p>
        
        <div class="seed-container">
            <span class="seed-label">シード共有 (最大6桁)</span>
            <div class="seed-input-group">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" id="title-seed-input" placeholder="任意">
                <button class="btn btn-small" id="btn-random-seed">ランダム</button>
            </div>
        </div>

        <button class="btn" id="btn-to-gen">ゲーム開始</button>
    </section>

    <!-- 2. ステージ生成画面 -->
    <section id="screen-generation">
        <h2 id="gen-status-title">ステージ構築中...</h2>
        <p id="gen-progress">0 / 5 完了</p>
        <p id="display-seed">シード: -</p>
        <button class="btn" id="btn-to-countdown" disabled>開始</button>
    </section>

    <!-- 3. 開始カウントダウン画面 -->
    <section id="screen-countdown">
        <div id="countdown-text">3</div>
    </section>

    <!-- 4. ゲーム画面 -->
    <section id="screen-game">
        <div class="system-controls">
            <button class="btn-system" style="background-color: #6c757d;" id="btn-giveup">ギブアップ</button>
            <button class="btn-system" id="btn-skip-stage">Next(Debug)</button>
        </div>
        <div class="game-header">
            <div class="main-stats">
                <div id="stage-number">STAGE 1 / 5</div>
                <div id="game-timer">00:00.00</div>
            </div>
            <div id="penalty-timer"></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="game-controls">
            <button class="btn" style="font-size: 1.2rem; padding: 15px 60px; background-color: #dc3545;" id="btn-reset-stage">リセット</button>
        </div>
    </section>

    <!-- 5. 結果画面 -->
    <section id="screen-result">
        <h2>全ステージクリア！</h2>
        <p style="font-size: 1.1rem; margin-bottom: 10px;">タイム</p>
        <div class="result-time" id="result-time">00:00.00</div>
        <div class="result-stats" id="result-stats"></div>
        <div class="result-buttons">
            <button class="btn" id="btn-restart">もう一度</button>
            <button class="btn" id="btn-to-title">タイトルへ</button>
        </div>
    </section>

    <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
