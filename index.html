<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unicurace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800;900&display=swap">
    <style>
        /* 夜のレース: 藍の地に、琥珀（石・タイマー）と水色（塗り跡）の 2 色 */
        :root {
            --bg: #15123A;          /* 地 */
            --panel: #0C0A26;       /* パネル・盤面 */
            --line: #4B4690;        /* 枠線 */
            --line-soft: #2E2A6E;
            --track: #26235F;       /* 未塗りマス・ゲージの地 */
            --text: #E9E7FF;
            --text-strong: #FFFFFF;
            --text-muted: #B9B5E8;
            --text-faint: #7C77C4;
            --amber: #FFB627;       /* 石・タイマー・主ボタン */
            --amber-glow: rgba(255, 182, 39, 0.45);
            --cyan: #35C6DA;        /* 塗り跡 */
            --cyan-soft: #9FE6F0;
            --danger: #FF6B6B;      /* ペナルティ */
            --danger-bg: #3A1430;

            /* 書体は M PLUS 1p に統一（数字が等幅なのでタイマーの桁が揺れない） */
            --font: 'M PLUS 1p', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            color-scheme: dark;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden; /* スクロール禁止 */
            -webkit-tap-highlight-color: transparent;
        }
        section {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 440px;
            height: 100%;
            margin: 0 auto;
            padding-top: max(32px, env(safe-area-inset-top, 0px));
            padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
            padding-left: max(24px, env(safe-area-inset-left, 0px));
            padding-right: max(24px, env(safe-area-inset-right, 0px));
        }
        section.active { display: flex; }
        .spacer { flex: 1 1 0; min-height: 0; }

        button, input { font-family: inherit; }
        button { cursor: pointer; white-space: nowrap; } /* ボタンの文言は折り返さない */
        button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
        .btn-primary {
            height: 60px;
            border: none;
            border-radius: 30px;
            background: var(--amber);
            color: var(--bg);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: transform 0.15s;
        }
        .btn-primary:disabled { background: var(--track); color: var(--text-faint); cursor: not-allowed; }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-outline {
            border: 1.5px solid var(--line);
            background: transparent;
            color: var(--text);
            font-weight: 700;
        }

        /* 1. タイトル */
        #screen-title { gap: 40px; padding-top: max(80px, env(safe-area-inset-top, 0px)); }
        .title-head { display: flex; flex-direction: column; gap: 6px; container-type: inline-size; }
        .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: var(--amber); white-space: nowrap; }
        .logo { margin: 0; font-size: 14vw; font-size: min(64px, 16cqw); /* 文字列の幅は文字サイズの約 5.85 倍。16cqw ならコンテナ幅の約 94% */ font-weight: 900; line-height: 1; letter-spacing: -0.02em; color: var(--text-strong); white-space: nowrap; }
        .tagline { font-size: 15px; color: var(--text-muted); }
        .tagline span { display: inline-block; white-space: nowrap; } /* 狭い画面では「―」の後で改行 */
        .title-strip { display: flex; gap: 4px; }
        .title-strip span { width: 40px; height: 40px; border-radius: 6px; flex-shrink: 1; }
        .title-strip .paint { background: var(--cyan); box-shadow: 0 0 10px rgba(53, 198, 218, 0.35); }
        .title-strip .empty { background: var(--track); }
        .title-strip .block { background: var(--panel); box-shadow: inset 0 0 0 1.5px #3A3580; }
        .title-strip .stone { display: flex; align-items: center; justify-content: center; }
        .title-strip .stone::after {
            content: ""; width: 26px; height: 26px; border-radius: 50%;
            background: var(--amber); box-shadow: 0 0 0 4px rgba(255, 182, 39, 0.25), 0 0 16px rgba(255, 182, 39, 0.7);
        }
        .seed-field { display: flex; flex-direction: column; gap: 10px; }
        .seed-field label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 700; color: var(--text-strong); }
        .seed-field label span { font-weight: 400; color: var(--text-muted); }
        .seed-row { display: flex; gap: 8px; }
        #title-seed-input {
            flex: 1 1 auto; min-width: 0; height: 56px;
            border: 1.5px solid var(--line); border-radius: 12px;
            background: var(--panel); color: var(--amber);
            padding: 0 16px;
            font-size: 26px; font-weight: 800; letter-spacing: 0.24em; font-variant-numeric: tabular-nums;
        }
        #title-seed-input::placeholder { color: var(--text-faint); font-size: 16px; letter-spacing: 0.04em; font-weight: 500; }
        #btn-random-seed { height: 56px; padding: 0 18px; border-radius: 12px; font-size: 14px; flex-shrink: 0; }

        /* 2. ステージ生成 */
        #screen-generation { gap: 16px; justify-content: center; text-align: center; }
        #gen-status-title { margin: 0; font-size: 24px; font-weight: 900; color: var(--text-strong); }
        #gen-progress { margin: 0; color: var(--text-muted); }
        #display-seed { margin: 8px 0 24px; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amber); letter-spacing: 0.12em; text-shadow: 0 0 10px var(--amber-glow); }

        /* 3. カウントダウン */
        #screen-countdown { justify-content: center; align-items: center; }
        #countdown-text { font-size: 120px; font-weight: 900; line-height: 1; color: var(--amber); text-shadow: 0 0 24px var(--amber-glow); }

        /* 4. ゲーム */
        #screen-game { gap: 18px; padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); position: relative; }
        .game-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn-system { height: 44px; padding: 0 16px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text-muted); flex-shrink: 0; }
        .game-bottom { display: flex; gap: 8px; }
        #btn-skip-stage { height: 56px; padding: 0 12px; border-radius: 12px; font-size: 12px; font-weight: 500; color: var(--text-faint); border-color: var(--line-soft); flex-shrink: 0; }
        .lap { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
        .lap-label { font-size: 14px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.08em; }
        #stage-number { font-size: 30px; font-weight: 900; line-height: 1; color: var(--text-strong); }
        #stage-total { font-size: 16px; font-weight: 800; color: var(--text-faint); }
        .timer-panel {
            background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px;
            padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .timer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        #game-timer { font-size: clamp(28px, 10vw, 48px); min-width: 0; font-weight: 800; line-height: 1; white-space: nowrap; color: var(--amber); font-variant-numeric: tabular-nums; text-shadow: 0 0 12px var(--amber-glow); }
        #penalty-timer { flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--danger); background: var(--danger-bg); padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
        .progress-row { display: flex; align-items: center; gap: 10px; }
        .progress-track { flex: 1 1 auto; height: 6px; background: #2A2763; border-radius: 3px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0; background: var(--cyan); border-radius: 3px; transition: width 0.12s; }
        #progress-text { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--cyan-soft); font-variant-numeric: tabular-nums; }
        .board-area { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
        #game-canvas { display: block; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line-soft); touch-action: none; }
        #btn-reset-stage {
            flex: 1 1 auto; min-width: 0;
            height: 56px; border: none; border-radius: 12px;
            background: var(--line-soft); color: var(--text-strong);
            font-size: 18px; font-weight: 900; letter-spacing: 0.12em;
        }
        #btn-reset-stage small { font-size: 0.72em; font-weight: 500; color: #FF8C8C; letter-spacing: 0; }

        /* ペナルティポップアップ演出 */
        .penalty-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--danger);
            font-size: 44px; font-weight: 900;
            text-shadow: 0 0 16px rgba(255, 107, 107, 0.5);
            pointer-events: none;
            z-index: 1000;
            animation: penaltyFloat 1.0s ease-out forwards;
        }
        @keyframes penaltyFloat {
            0% { transform: translate(-50%, -50%); opacity: 1; }
            100% { transform: translate(-50%, -150%); opacity: 0; }
        }

        /* 5. 結果 */
        #screen-result { gap: 12px; justify-content: center; text-align: center; }
        #screen-result h2 { margin: 0; font-size: 36px; font-weight: 900; color: var(--text-strong); }
        .result-label { margin: 16px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: var(--text-muted); }
        .result-time { font-size: clamp(40px, 14vw, 56px); font-weight: 800; line-height: 1.1; white-space: nowrap; color: var(--amber); font-variant-numeric: tabular-nums; text-shadow: 0 0 14px var(--amber-glow); }
        .result-stats { font-size: 14px; line-height: 1.8; color: var(--text-muted); margin: 8px 0 24px; }
        .result-buttons { display: flex; gap: 12px; }
        .result-buttons button { flex: 1 1 0; }
        #btn-to-title { height: 60px; border-radius: 30px; font-size: 16px; }

        @media (prefers-reduced-motion: reduce) {
            .penalty-popup { animation-duration: 0.01s; }
            #progress-bar, .btn-primary { transition: none; }
        }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <section id="screen-title" class="active">
        <div class="title-head">
            <span class="eyebrow" data-fit-text>ONE-STROKE SLIDE PUZZLE</span>
            <h1 class="logo" data-fit-text>UNICURACE</h1>
            <span class="tagline"><span>ユニキュレイス ―</span> <span>一筆書き塗りつぶしパズル</span></span>
        </div>

        <div class="title-strip" aria-hidden="true">
            <span class="paint"></span><span class="paint"></span><span class="paint"></span><span class="paint stone"></span><span class="empty"></span><span class="empty"></span><span class="block"></span>
        </div>

        <div class="spacer"></div>

        <div class="seed-field">
            <label for="title-seed-input">シード <span>同じ番号なら友だちと同じ 5 ステージ</span></label>
            <div class="seed-row">
                <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" id="title-seed-input" placeholder="空欄でおまかせ">
                <button type="button" class="btn-outline" id="btn-random-seed">ランダム</button>
            </div>
        </div>

        <button type="button" class="btn-primary" id="btn-to-gen">ゲーム開始</button>
    </section>

    <!-- 2. ステージ生成画面 -->
    <section id="screen-generation">
        <h2 id="gen-status-title">ステージ構築中...</h2>
        <p id="gen-progress">0 / 5 完了</p>
        <p id="display-seed" data-fit-text>シード: -</p>
        <button type="button" class="btn-primary" id="btn-to-countdown" disabled>スタート</button>
    </section>

    <!-- 3. 開始カウントダウン画面 -->
    <section id="screen-countdown">
        <div id="countdown-text">3</div>
    </section>

    <!-- 4. ゲーム画面 -->
    <section id="screen-game">
        <div class="game-top">
            <button type="button" class="btn-system btn-outline" id="btn-giveup">ギブアップ</button>
            <div class="lap" aria-label="ステージ">
                <span class="lap-label">LAP</span>
                <span id="stage-number">1</span>
                <span id="stage-total">/ 5</span>
            </div>
        </div>

        <div class="timer-panel">
            <div class="timer-row">
                <div id="game-timer" data-fit-text>00:00.00</div>
                <div id="penalty-timer" hidden></div>
            </div>
            <div class="progress-row">
                <div class="progress-track"><div id="progress-bar"></div></div>
                <span id="progress-text">0/0</span>
            </div>
        </div>

        <div class="board-area">
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="game-bottom">
            <button type="button" id="btn-reset-stage" data-fit-text>リセット <small>+3秒</small></button>
            <button type="button" class="btn-outline" id="btn-skip-stage">Next(Debug)</button>
        </div>
    </section>

    <!-- 5. 結果画面 -->
    <section id="screen-result">
        <h2>FINISH!</h2>
        <p class="result-label">TOTAL TIME</p>
        <div class="result-time" id="result-time" data-fit-text>00:00.00</div>
        <div class="result-stats" id="result-stats"></div>
        <div class="result-buttons">
            <button type="button" class="btn-primary" id="btn-restart">もう一度</button>
            <button type="button" class="btn-outline" id="btn-to-title">タイトルへ</button>
        </div>
    </section>

    <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
