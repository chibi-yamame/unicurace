<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unicurace - Single Player</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            overflow: hidden; /* スクロール禁止 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        section {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        section.active { display: flex; }

        h1 { font-size: 2rem; margin-bottom: 1rem; color: var(--primary-color); }
        
        /* シード入力関連 */
        .seed-container { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .seed-input-group { display: flex; gap: 5px; }
        #title-seed-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 120px; text-align: center; font-size: 1.1rem; }
        .btn-small { padding: 8px 15px; font-size: 0.9rem; background-color: #6c757d; border-radius: 8px; }
        .seed-label { font-size: 0.9rem; color: #666; }
        #display-seed { font-weight: bold; color: var(--primary-color); margin-top: 5px; }

        .btn {
            padding: 15px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn:active { transform: scale(0.95); }

        /* カウントダウン */
        #countdown-text { font-size: 8rem; font-weight: bold; color: var(--primary-color); }

        /* ゲーム画面 */
        .game-header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .main-stats { width: 100%; display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 5px; }
        #game-canvas { background: white; border: 4px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 90vw; max-height: 90vw; }
        #penalty-timer { color: #ff4757; font-size: 0.9rem; font-weight: bold; min-height: 1.2em; }
        
        .system-controls { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .game-controls { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
        .btn-system { padding: 8px 15px; font-size: 0.8rem; border-radius: 8px; background-color: #6c757d; color: white; border: none; cursor: pointer; }

        /* ペナルティポップアップ演出 */
        .penalty-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4757;
            font-size: 2.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            animation: penaltyFloat 1.0s ease-out forwards;
        }
        @keyframes penaltyFloat {
            0% { transform: translate(-50%, -50%); opacity: 1; }
            100% { transform: translate(-50%, -150%); opacity: 0; }
        }

        /* 結果画面 */
        #screen-result h2 { font-size: 2.5rem; margin-bottom: 30px; color: var(--primary-color); }
        .result-time { font-size: 3rem; font-weight: bold; color: var(--primary-color); margin: 20px 0; font-family: 'Courier New', monospace; }
        .result-stats { font-size: 1rem; margin: 20px 0; color: #666; }
        .result-buttons { display: flex; gap: 15px; margin-top: 30px; width: 100%; justify-content: center; }
        .result-buttons .btn { flex: 1; max-width: 200px; }
    </style>
</head>
<body>

    <!-- 1. タイトル画面 -->
    <section id="screen-title" class="active">
        <h1>Unicurace</h1>
        <p>一筆書き塗りつぶしパズル</p>
        
        <div class="seed-container">
            <span class="seed-label">シード共有 (最大6桁)</span>
            <div class="seed-input-group">
                <input type="number" id="title-seed-input" placeholder="任意" min="0" max="999999" oninput="if(value.length>6)value=value.slice(0,6)">
                <button class="btn btn-small" id="btn-random-seed">ランダム</button>
            </div>
        </div>

        <button class="btn" id="btn-to-gen">ゲーム開始</button>
    </section>

    <!-- 2. ステージ生成画面 -->
    <section id="screen-generation">
        <h2 id="gen-status-title">ステージ構築中...</h2>
        <p id="gen-progress">0 / 5 完了</p>
        <p id="display-seed">シード: -</p>
        <button class="btn" id="btn-to-countdown" disabled>開始</button>
    </section>

    <!-- 3. 開始カウントダウン画面 -->
    <section id="screen-countdown">
        <div id="countdown-text">3</div>
    </section>

    <!-- 4. ゲーム画面 -->
    <section id="screen-game">
        <div class="system-controls">
            <button class="btn-system" style="background-color: #6c757d;" id="btn-giveup">ギブアップ</button>
            <button class="btn-system" id="btn-skip-stage">Next(Debug)</button>
        </div>
        <div class="game-header">
            <div class="main-stats">
                <div id="stage-number">STAGE 1 / 5</div>
                <div id="game-timer">00:00.00</div>
            </div>
            <div id="penalty-timer"></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="game-controls">
            <button class="btn" style="font-size: 1.2rem; padding: 15px 60px; background-color: #dc3545;" id="btn-reset-stage">リセット</button>
        </div>
    </section>

    <!-- 5. 結果画面 -->
    <section id="screen-result">
        <h2>全ステージクリア！</h2>
        <p style="font-size: 1.1rem; margin-bottom: 10px;">タイム</p>
        <div class="result-time" id="result-time">00:00.00</div>
        <div class="result-stats" id="result-stats"></div>
        <div class="result-buttons">
            <button class="btn" id="btn-restart">もう一度</button>
            <button class="btn" id="btn-to-title">タイトルへ</button>
        </div>
    </section>

    <script type="module">
        import { SeededRandom } from './src/utils/random.js';
        import { findSolutionPath } from './src/core/solver.js';
        import { generateStageViaSimulationWithRetry } from './src/core/generator.js';
        import { renderGame } from './src/view/renderer.js';

        // --- 定数定義 ---
        const CONFIG = {
            gridSize: 7,
            stageTotal: 5,
            blockRatioMin: 0.15,
            blockRatioMax: 0.35,
            moveSpeed: 0.06, // 石の移動速度（1マスあたりの秒数）
            canvasSize: 400,
            swipeThreshold: 30, // スワイプと判定する最小ピクセル数
            penaltyTime: 3000, // ペナルティ時間（ミリ秒）
        };

        // ゲーム状態
        let state = {
            stages: [],
            currentStageIdx: 0,
            currentSeed: 0,
            startTime: 0,
            elapsedTime: 0,
            timerId: null,
            isMoving: false, // 石が移動中かどうか
            penaltyTime: 0, // ペナルティの累計（ミリ秒）
            deadlockCount: 0, // 行き止まり回数
            manualResetCount: 0, // 手動リセット回数
            playerPos: { x: 0, y: 0 }, // 現在の石の位置
            currentPainted: [] // 現在のステージの塗りつぶし状況
        };

        // 画面遷移
        function showScreen(screenId) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // シード生成ボタン
        document.getElementById('btn-random-seed').onclick = () => {
            const randomSeed = Math.floor(Math.random() * 1000000);
            document.getElementById('title-seed-input').value = String(randomSeed).padStart(6, '0');
        };

        // --- 1. タイトル画面処理 ---
        document.getElementById('btn-to-gen').onclick = () => {
            const seedInput = document.getElementById('title-seed-input').value;
            // 入力がない場合は現在時刻をベースにした6桁のシードを生成
            state.currentSeed = seedInput === '' ? (Date.now() % 1000000) : parseInt(seedInput);
            
            document.getElementById('display-seed').textContent = `シード: ${String(state.currentSeed).padStart(6, '0')}`;
            showScreen('screen-generation');
            startStageGeneration();
        };

        // --- 2. ステージ生成画面処理 ---
        async function startStageGeneration() {
            state.stages = [];
            const title = document.getElementById('gen-status-title');
            const btn = document.getElementById('btn-to-countdown');
            const progress = document.getElementById('gen-progress');
            btn.disabled = true;
            title.textContent = "ステージ構築中...";

            const rng = new SeededRandom(state.currentSeed);

            for (let i = 0; i < CONFIG.stageTotal; i++) {
                let stageData = null;
                let solvable = false;

                stageData = generateStageViaSimulationWithRetry(
                    rng, CONFIG.gridSize, CONFIG.gridSize - 1, CONFIG.blockRatioMin, CONFIG.blockRatioMax
                );


                state.stages.push(stageData);
                progress.textContent = `${i + 1} / ${CONFIG.stageTotal} 完了`;
                await new Promise(r => setTimeout(r, 100)); // 演出用
            }

            title.textContent = "ステージ構築完了！";
            btn.disabled = false;
        }

        document.getElementById('btn-to-countdown').onclick = () => {
            if (state.stages.length < CONFIG.stageTotal) return;
            showScreen('screen-countdown');
            startCountdown();
            state.penaltyTime = 0;
            state.deadlockCount = 0;
            state.manualResetCount = 0;
        };

        // --- 4. ゲーム画面処理 ---
        function startGame() {
            showScreen('screen-game');
            state.currentStageIdx = 0;
            state.startTime = performance.now();
            updateTimer();
            loadStage(0);
        }
        
        // カウントダウン処理
        function startCountdown() {
            const text = document.getElementById('countdown-text');
            let count = 3;
            text.textContent = count;
            const interval = setInterval(() => {
                count--;
                if (count > 0) text.textContent = count;
                else if (count === 0) text.textContent = "GO!";
                else { clearInterval(interval); startGame(); }
            }, 1000);
        }

        function updateTimer() {
            const now = performance.now();
            state.elapsedTime = (now - state.startTime) + state.penaltyTime;
            
            const diff = new Date(state.elapsedTime);
            // Minutes can exceed 60 in some implementations of Date diff, so manual calculation
            const totalSeconds = Math.floor(state.elapsedTime / 1000);
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const s = String(diff.getUTCSeconds()).padStart(2, '0');
            const ms = String(Math.floor(diff.getUTCMilliseconds() / 10)).padStart(2, '0');
            
            document.getElementById('game-timer').textContent = `${m}:${s}.${ms}`;
            document.getElementById('penalty-timer').textContent = state.penaltyTime > 0 ? `+${(state.penaltyTime / 1000).toFixed(2)}s Penalty` : '';
            state.timerId = requestAnimationFrame(updateTimer);
        }

        function loadStage(idx) {
            if (idx >= CONFIG.stageTotal) {
                finishGame();
                return;
            }
            const stageData = state.stages[idx];
            document.getElementById('stage-number').textContent = `STAGE ${idx + 1} / ${CONFIG.stageTotal}`;
            
            // プレイ用データの初期化
            state.playerPos = { x: stageData.startPos[0], y: stageData.startPos[1] };
            state.currentPainted = stageData.grid.map(row => row.map(cell => cell === 1)); // ブロックは塗り済み扱い
            state.currentPainted[stageData.startPos[1]][stageData.startPos[0]] = true; // スタート地点を塗る

            updateDisplay();
        }

        // --- 入力検知 (Swipe & Mouse) ---
        let touchStartPos = null;
        const canvasElement = document.getElementById('game-canvas');

        const handleInputStart = (x, y) => {
            if (state.isMoving) return;
            touchStartPos = { x, y };
        };

        const handleInputEnd = (x, y) => {
            if (!touchStartPos || state.isMoving) return;
            const dx = x - touchStartPos.x;
            const dy = y - touchStartPos.y;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);

            if (Math.max(absX, absY) > CONFIG.swipeThreshold) {
                if (absX > absY) {
                    executeMove(dx > 0 ? 1 : -1, 0);
                } else {
                    executeMove(0, dy > 0 ? 1 : -1);
                }
            }
            touchStartPos = null;
        };

        canvasElement.addEventListener('touchstart', e => {
            e.preventDefault();
            handleInputStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchend', e => handleInputEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
        
        canvasElement.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY));
        window.addEventListener('mouseup', e => handleInputEnd(e.clientX, e.clientY));

        // --- 移動実行 & アニメーション ---
        function executeMove(dx, dy) {
            const stageData = state.stages[state.currentStageIdx];
            const N = CONFIG.gridSize;
            
            let targetX = Math.round(state.playerPos.x);
            let targetY = Math.round(state.playerPos.y);
            let moveDistance = 0;

            // どこまで滑れるか計算
            while (true) {
                const nextX = targetX + dx;
                const nextY = targetY + dy;
                if (nextX < 0 || nextX >= N || nextY < 0 || nextY >= N) break;
                if (stageData.grid[nextY][nextX] === 1 || state.currentPainted[nextY][nextX]) break;
                targetX = nextX;
                targetY = nextY;
                moveDistance++;
            }

            if (moveDistance === 0) return;

            state.isMoving = true;
            const startX = state.playerPos.x;
            const startY = state.playerPos.y;
            const duration = moveDistance * CONFIG.moveSpeed * 1000; // CONFIGに基づいた移動時間
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // イージング（滑らかな停止）をかける場合はここを調整
                state.playerPos.x = startX + (targetX - startX) * progress;
                state.playerPos.y = startY + (targetY - startY) * progress;

                // 通過したマスをリアルタイムで塗りつぶし
                // progressがある程度進んでから、あるいは整数の位置を通過した際に塗る
                const gridX = dx !== 0 ? (progress > 0.5 ? targetX : startX) : startX;
                const gridY = dy !== 0 ? (progress > 0.5 ? targetY : startY) : startY;
                
                // アニメーション中の全整数座標をマーク
                state.currentPainted[Math.floor(state.playerPos.y + 0.5)][Math.floor(state.playerPos.x + 0.5)] = true;

                updateDisplay();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    state.playerPos.x = targetX;
                    state.playerPos.y = targetY;
                    state.isMoving = false;
                    checkDeadlock();
                    checkClear();
                }
            }
            requestAnimationFrame(animate);
        }

        function checkClear() {
            const stageData = state.stages[state.currentStageIdx];
            const isAllPainted = state.currentPainted.every((row, y) => 
                row.every((cell, x) => stageData.grid[y][x] === 1 || cell)
            );

            if (isAllPainted) {
                setTimeout(() => {
                    state.currentStageIdx++;
                    loadStage(state.currentStageIdx);
                }, 200); // クリア後の余韻
            }
        }

        function checkDeadlock() {
            const stageData = state.stages[state.currentStageIdx];
            const N = CONFIG.gridSize;
            const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            
            const canMove = dirs.some(([dx, dy]) => {
                const nx = state.playerPos.x + dx;
                const ny = state.playerPos.y + dy;
                if (nx < 0 || nx >= N || ny < 0 || ny >= N) return false;
                if (stageData.grid[ny][nx] === 1 || state.currentPainted[ny][nx]) return false;
                return true;
            });

            if (!canMove) {
                // 全てのマスが埋まっているか確認（クリアならデッドロックではない）
                const isAllPainted = state.currentPainted.every((row, y) => 
                    row.every((cell, x) => stageData.grid[y][x] === 1 || cell)
                );
                
                if (!isAllPainted) {
                    state.deadlockCount++;
                    resetCurrentStage(true);
                }
            }
        }

        function showPenaltyVisual() {
            const screenGame = document.getElementById('screen-game');
            const popup = document.createElement('div');
            popup.className = 'penalty-popup';
            popup.textContent = '+' + (CONFIG.penaltyTime / 1000).toFixed(2) + 's';
            screenGame.appendChild(popup);

            // アニメーション終了後に要素を削除
            popup.addEventListener('animationend', () => {
                popup.remove();
            });
        }

        function resetCurrentStage(isAuto = false) {
            if (state.isMoving) return;
            if (!isAuto) state.manualResetCount++;
            state.penaltyTime += CONFIG.penaltyTime;
            showPenaltyVisual();
            loadStage(state.currentStageIdx);
        }

        document.getElementById('btn-reset-stage').onclick = () => {
            resetCurrentStage();
        };

        // ギブアップ処理（タイトルに戻る）
        document.getElementById('btn-giveup').onclick = () => {
            cancelAnimationFrame(state.timerId);
            showScreen('screen-title');
        };

        function updateDisplay() {
            const canvas = document.getElementById('game-canvas');
            const stageData = state.stages[state.currentStageIdx];
            if (!stageData) return;
            renderGame(canvas, stageData, state.playerPos, state.currentPainted, CONFIG);
        }

        function finishGame() {
            cancelAnimationFrame(state.timerId);
            const finalTime = document.getElementById('game-timer').textContent;
            document.getElementById('result-time').textContent = finalTime;
            document.getElementById('result-stats').innerHTML = `
                全${CONFIG.stageTotal}ステージ完了<br>
                行き止まり: ${state.deadlockCount}回 / リトライ: ${state.manualResetCount}回<br>
                (ペナルティ合計: ${(state.penaltyTime / 1000).toFixed(1)}秒)
            `;
            showScreen('screen-result');
        }

        // 結果画面ボタン
        document.getElementById('btn-restart').onclick = () => {
            showScreen('screen-generation');
            startStageGeneration();
        };
        document.getElementById('btn-to-title').onclick = () => {
            cancelAnimationFrame(state.timerId);
            showScreen('screen-title');
        };

        // デバッグ用: ステージスキップ
        document.getElementById('btn-skip-stage').onclick = () => {
            state.currentStageIdx++;
            loadStage(state.currentStageIdx);
        };

    </script>
</body>
</html>
