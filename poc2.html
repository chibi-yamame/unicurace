<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塗りつぶしゲーム PoC2 (インクリメンタル生成)</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; }
        canvas { border: 2px solid #000; margin: 20px; background-color: white; }
        button { margin: 10px; padding: 10px 15px; font-size: 14px; cursor: pointer; }
        input { margin: 5px; padding: 5px; font-size: 14px; }
        #info { margin-top: 20px; font-size: 14px; }
        #path { margin-top: 10px; color: #0066cc; font-weight: bold; }
        .status { padding: 10px; margin: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>塗りつぶしゲーム PoC2 (インクリメンタル生成)</h1>
    <div>
        <label for="seed">シード値:</label>
        <input type="number" id="seed" value="12345">
        <label for="gridSize">グリッドサイズ:</label>
        <input type="number" id="gridSize" value="4" min="3" max="8">
        <label for="blockCount">ブロック数:</label>
        <input type="number" id="blockCount" value="4" min="0" max="20">
        <button onclick="generateStage()">ステージ生成</button>
        <button onclick="runTests()" style="background-color: #ffaa00;">テスト実行</button>
    </div>
    <br>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <br>
    <button onclick="showSolution()">塗りつぶし経路を計算・表示</button>
    <div id="info">
        <div id="status"></div>
        <div id="path"></div>
    </div>

    <script>
        let N = 4; // グリッドサイズ
        let grid = [];
        let solutionPath = [];
        let painted = [];

        // シード付き乱数生成器
        class SeededRandom {
            constructor(seed) {
                this.seed = seed;
            }
            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
        }

        // 指定した方向に滑る（ブロックか塗りつぶし領域にぶつかるまで）
        function slideInDirection(x, y, dx, dy, grid, painted) {
            const path = [];
            
            while (true) {
                const nextX = x + dx;
                const nextY = y + dy;
                
                // 境界チェック
                if (nextX < 0 || nextX >= N || nextY < 0 || nextY >= N) {
                    break;
                }
                
                // ブロック or 既に塗りつぶされたマスをチェック
                if (grid[nextY][nextX] === 1 || painted[nextY][nextX]) {
                    break;
                }
                
                x = nextX;
                y = nextY;
                path.push([x, y]);
            }
            
            return { endX: x, endY: y, path: path };
        }

        // 現在のマスから4方向に滑った時の結果を全て返す
        function getAllMoves(x, y, grid, painted) {
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            const moves = [];
            
            for (const [dx, dy] of directions) {
                const result = slideInDirection(x, y, dx, dy, grid, painted);
                if (result.path.length > 0) { // 移動できた場合のみ
                    moves.push({
                        endX: result.endX,
                        endY: result.endY,
                        path: result.path,
                        dx: dx,
                        dy: dy
                    });
                }
            }
            
            return moves;
        }

        // 到達可能マス集合を返す（スタートから到達可能な全マス）
        function getReachableSet(grid) {
            const reachable = Array(N).fill().map(() => Array(N).fill(false));
            reachable[0][0] = true;
            let reachableCount = 1;
            
            const queue = [[0, 0]];
            
            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const moves = getAllMoves(x, y, grid, reachable);
                
                for (const move of moves) {
                    for (const [nx, ny] of move.path) {
                        if (!reachable[ny][nx]) {
                            reachable[ny][nx] = true;
                            reachableCount++;
                            queue.push([nx, ny]);
                        }
                    }
                }
            }
            
            return { reachable, count: reachableCount };
        }

        // インクリメンタル生成：ブロック追加時に必ず到達可能性を保持
        function generateStageIncremental(seed, N, targetBlockCount) {
            const rng = new SeededRandom(seed);
            grid = Array(N).fill().map(() => Array(N).fill(0)); // 0: 空き, 1: ブロック
            
            let blocksPlaced = 0;
            const candidates = [];
            
            // 候補位置を生成（スタート位置を除く）
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    if (!(x === 0 && y === 0)) {
                        candidates.push([x, y]);
                    }
                }
            }
            
            // シード値に基づいて候補をシャッフル
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(rng.next() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            
            // インクリメンタルにブロックを追加
            let rejectedCount = 0;
            for (const [x, y] of candidates) {
                if (blocksPlaced >= targetBlockCount) break;
                
                // ブロックを仮置き
                grid[y][x] = 1;
                
                // 到達可能マス集合を確認
                const { reachable, count: reachableCount } = getReachableSet(grid);
                
                // 全ての空きマスが到達可能か確認
                let allReachable = true;
                let unreachableCount = 0;
                for (let yy = 0; yy < N; yy++) {
                    for (let xx = 0; xx < N; xx++) {
                        if (grid[yy][xx] === 0 && !reachable[yy][xx]) {
                            allReachable = false;
                            unreachableCount++;
                        }
                    }
                }
                
                if (allReachable) {
                    // 到達可能性が保たれている → ブロックを確定
                    blocksPlaced++;
                } else {
                    // 孤立が生じる → ロールバック
                    grid[y][x] = 0;
                    rejectedCount++;
                }
            }
            
            return blocksPlaced;
        }

        // ステージ生成
        function generateStage() {
            N = parseInt(document.getElementById('gridSize').value);
            const seed = parseInt(document.getElementById('seed').value);
            const targetBlocks = parseInt(document.getElementById('blockCount').value);
            
            const placedBlocks = generateStageIncremental(seed, N, targetBlocks);
            
            painted = Array(N).fill().map(() => Array(N).fill(false));
            painted[0][0] = true;
            solutionPath = [];
            drawGrid();
            document.getElementById('status').innerHTML = `<div class="status success">✓ ステージ生成成功 (ブロック数: ${placedBlocks}/${targetBlocks})</div>`;
            document.getElementById('path').innerHTML = '';
        }

        // DFSで全マスを塗りつぶす経路を探索
        function findSolutionPath() {
            const allMaps = Array(N).fill().map(() => Array(N).fill(false));
            allMaps[0][0] = true;
            const moves = [];
            
            function dfs(x, y, depth) {
                if (depth > 1000) return false; // 無限ループ防止
                
                // 全マスが塗りつぶされたか確認
                let allPainted = true;
                for (let yy = 0; yy < N; yy++) {
                    for (let xx = 0; xx < N; xx++) {
                        if (grid[yy][xx] === 0 && !allMaps[yy][xx]) {
                            allPainted = false;
                            break;
                        }
                    }
                    if (!allPainted) break;
                }
                
                if (allPainted) return true;
                
                const possibleMoves = getAllMoves(x, y, grid, allMaps);
                
                for (const move of possibleMoves) {
                    // この移動で新しいマスを塗りつぶすか確認
                    let hasNewCell = false;
                    for (const [nx, ny] of move.path) {
                        if (!allMaps[ny][nx]) {
                            hasNewCell = true;
                            allMaps[ny][nx] = true;
                        }
                    }
                    
                    if (hasNewCell) {
                        moves.push({
                            startX: x,
                            startY: y,
                            endX: move.endX,
                            endY: move.endY,
                            path: move.path,
                            direction: move.dx === 1 ? '右' : move.dx === -1 ? '左' : move.dy === 1 ? '下' : '上'
                        });
                        
                        if (dfs(move.endX, move.endY, depth + 1)) {
                            return true;
                        }
                        
                        // バックトラック
                        for (const [nx, ny] of move.path) {
                            allMaps[ny][nx] = false;
                        }
                        moves.pop();
                    }
                }
                
                return false;
            }
            
            if (dfs(0, 0, 0)) {
                return moves;
            }
            return null;
        }

        // グリッド描画
        function drawGrid(highlightPath = []) {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const cellSize = canvas.width / N;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // セルを描画
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const isHighlight = highlightPath.some(([px, py]) => px === x && py === y);
                    
                    if (grid[y][x] === 1) {
                        ctx.fillStyle = '#333'; // ブロック
                    } else if (isHighlight) {
                        ctx.fillStyle = '#ffeb3b'; // ハイライト
                    } else if (painted[y][x]) {
                        ctx.fillStyle = '#e0e0e0'; // 塗りつぶし済み
                    } else {
                        ctx.fillStyle = '#fff'; // 空き
                    }
                    
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
            
            // スタート位置をマーク
            ctx.fillStyle = '#f00';
            ctx.fillRect(0, 0, cellSize, cellSize);
            ctx.fillStyle = '#fff';
            ctx.font = `${cellSize * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('S', cellSize / 2, cellSize / 2);
        }

        // 矢印描画関数
        function drawArrow(ctx, fromX, fromY, toX, toY, cellSize, color = '#00f') {
            const headlen = cellSize * 0.25;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        // 塗りつぶし経路を計算・表示
        function showSolution() {
            if (grid.length === 0) {
                alert('まずステージを生成してください。');
                return;
            }

            document.getElementById('status').innerHTML = '<div class="status">計算中...</div>';
            
            // 非同期で計算（UIをブロックしないため）
            setTimeout(() => {
                const solution = findSolutionPath();
                
                if (!solution) {
                    document.getElementById('status').innerHTML = '<div class="status error">✗ 解が見つかりません</div>';
                    return;
                }

                // 解をシミュレート
                let x = 0, y = 0;
                painted = Array(N).fill().map(() => Array(N).fill(false));
                painted[0][0] = true;

                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');
                const cellSize = canvas.width / N;

                drawGrid();

                let moveCount = 0;
                for (const move of solution) {
                    for (const [nx, ny] of move.path) {
                        painted[ny][nx] = true;
                    }

                    const fromX = (move.startX + 0.5) * cellSize;
                    const fromY = (move.startY + 0.5) * cellSize;
                    const toX = (move.endX + 0.5) * cellSize;
                    const toY = (move.endY + 0.5) * cellSize;
                    drawArrow(ctx, fromX, fromY, toX, toY, cellSize, '#f00');
                    moveCount++;
                    x = move.endX;
                    y = move.endY;
                }

                let pathText = '<strong>移動経路:</strong><br>';
                for (let i = 0; i < solution.length; i++) {
                    const move = solution[i];
                    pathText += `${i + 1}. (${move.startX}, ${move.startY}) → ${move.direction} → (${move.endX}, ${move.endY})<br>`;
                }
                
                document.getElementById('status').innerHTML = `<div class="status success">✓ 解を発見 (${moveCount}手)</div>`;
                document.getElementById('path').innerHTML = pathText;
            }, 100);
        }

        // 初期化
        window.onload = () => {
            document.getElementById('status').innerHTML = '';
        };

        // テスト関数：複数の条件で生成をテスト
        function runTests() {
            const testCases = [
                { N: 4, targetBlocks: 2 },
                { N: 4, targetBlocks: 4 },
                { N: 5, targetBlocks: 4 },
                { N: 5, targetBlocks: 6 },
            ];

            const testCount = 5; // 各条件について5回テストに削減
            const results = [];

            document.getElementById('status').innerHTML = '<div class="status">テスト実行中: 0/' + (testCases.length * testCount) + '</div>';
            document.getElementById('path').innerHTML = '';

            let testIndex = 0;
            let caseIndex = 0;

            function runNextTest() {
                if (caseIndex >= testCases.length) {
                    // すべてのテストが完了
                    displayResults(results);
                    return;
                }

                const testCase = testCases[caseIndex];
                const { N: testN, targetBlocks } = testCase;

                if (!results[caseIndex]) {
                    results[caseIndex] = { N: testN, targetBlocks, successCount: 0, totalTests: testCount, details: [] };
                }

                if (testIndex < testCount) {
                    const seed = 12345 + testIndex;
                    const placedBlocks = generateStageIncremental(seed, testN, targetBlocks);
                    
                    if (placedBlocks === targetBlocks) {
                        results[caseIndex].successCount++;
                    }
                    results[caseIndex].details.push(placedBlocks);

                    testIndex++;
                    const totalDone = caseIndex * testCount + testIndex;
                    const totalTests = testCases.length * testCount;
                    document.getElementById('status').innerHTML = `<div class="status">テスト実行中: ${totalDone}/${totalTests}</div>`;

                    // 次のテストを非同期で実行
                    setTimeout(runNextTest, 10);
                } else {
                    // このケースのテストが完了 → 次のケースへ
                    testIndex = 0;
                    caseIndex++;
                    setTimeout(runNextTest, 10);
                }
            }

            runNextTest();
        }

        // テスト結果表示
        function displayResults(results) {
            let resultHtml = '<div class="status"><strong>テスト結果:</strong><br>';
            resultHtml += '<table style="margin: auto; border-collapse: collapse; font-size: 12px;">';
            resultHtml += '<tr style="border-bottom: 1px solid #ccc;"><th style="padding: 5px; border: 1px solid #ccc;">グリッド</th><th style="padding: 5px; border: 1px solid #ccc;">目標ブロック数</th><th style="padding: 5px; border: 1px solid #ccc;">成功率</th><th style="padding: 5px; border: 1px solid #ccc;">詳細</th></tr>';
            
            for (const result of results) {
                const successRate = ((result.successCount / result.totalTests) * 100).toFixed(1);
                const statusColor = successRate === '100.0' ? '#d4edda' : '#fff3cd';
                resultHtml += `<tr style="background-color: ${statusColor}; border-bottom: 1px solid #ccc;">`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${result.N}x${result.N}</td>`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${result.targetBlocks}</td>`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${result.successCount}/${result.totalTests} (${successRate}%)</td>`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc; font-family: monospace; font-size: 11px;">${result.details.join(',')}</td>`;
                resultHtml += '</tr>';
            }

            resultHtml += '</table></div>';
            document.getElementById('status').innerHTML = resultHtml;

            // コンソール出力
            console.log('=== テスト結果サマリー ===');
            for (const result of results) {
                const successRate = ((result.successCount / result.totalTests) * 100).toFixed(1);
                console.log(`${result.N}x${result.N}, Target=${result.targetBlocks}: ${result.successCount}/${result.totalTests} (${successRate}%) - 詳細: ${result.details.join(',')}`);
            }
        }
    </script>
</body>
</html>
