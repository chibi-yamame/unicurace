<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塗りつぶしゲーム PoC3 (シミュレーションベース)</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; }
        canvas { border: 2px solid #000; margin: 20px; background-color: white; }
        button { margin: 10px; padding: 10px 15px; font-size: 14px; cursor: pointer; }
        input { margin: 5px; padding: 5px; font-size: 14px; }
        #info { margin-top: 20px; font-size: 14px; }
        #path { margin-top: 10px; color: #0066cc; font-weight: bold; }
        .status { padding: 10px; margin: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>塗りつぶしゲーム PoC3 (シミュレーションベース)</h1>
    <div>
        <label for="seed">シード値:</label>
        <input type="number" id="seed" value="12345">
        <label for="gridSize">グリッドサイズ:</label>
        <input type="number" id="gridSize" value="5" min="3" max="8">
        <label for="moveRangeMax">移動範囲上限:</label>
        <input type="number" id="moveRangeMax" value="10" min="2" max="20">
        <button onclick="generateStage()">ステージ生成</button>
        <button onclick="runTests()" style="background-color: #ffaa00;">テスト実行</button>
    </div>
    <br>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <br>
    <button onclick="showSolution()">塗りつぶし経路を計算・表示</button>
    <div id="info">
        <div id="status"></div>
        <div id="path"></div>
    </div>

    <script>
        let N = 5;
        let grid = [];
        let painted = [];
        let solutionPath = [];
        let startPos = [0, 0]; // ★追加：ステージのスタート位置を保存

        // シード付き乱数生成器
        class SeededRandom {
            constructor(seed) {
                this.seed = seed;
            }
            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
        }

        // 方向をランダムにシャッフル
        function shuffleDirections(directions, rng) {
            for (let i = directions.length - 1; i > 0; i--) {
                const j = Math.floor(rng.next() * (i + 1));
                [directions[i], directions[j]] = [directions[j], directions[i]];
            }
        }

        // シミュレーションベースのステージ生成（デバッグ情報付き）
        function generateStageViaSimulation(seed, N, moveRangeMax, debugMode = false) {
            const rng = new SeededRandom(seed);
            const painted = Array(N).fill().map(() => Array(N).fill(false));
            const blocks = [];
            const movementLog = []; // デバッグ: 移動履歴

            // ★修正：シードに基づいてランダムなスタート位置を決定
            let x = Math.floor(rng.next() * N);
            let y = Math.floor(rng.next() * N);
            
            painted[y][x] = true;
            const startPos = [x, y]; // デバッグ用にスタート位置を記録
            let turnCount = 0;

            while (true) {
                const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]]; // 下, 右, 上, 左
                shuffleDirections(directions, rng);

                let moved = false;

                for (const [dx, dy] of directions) {
                    // 実際に進める最大距離を計算
                    let maxDist = 0;
                    for (let d = 1; d <= moveRangeMax; d++) {
                        const nx = x + dx * d;
                        const ny = y + dy * d;

                        // 境界チェック
                        if (nx < 0 || nx >= N || ny < 0 || ny >= N) break;
                        // 既に塗りつぶされたマスをチェック
                        if (painted[ny][nx]) break;

                        maxDist = d;
                    }

                    if (maxDist > 0) {
                        // 進む距離をランダム決定 (1 ~ moveRangeMax)
                        const choosenDist = Math.floor(rng.next() * moveRangeMax) + 1;
                        const actualDist = Math.min(choosenDist, maxDist);

                        // デバッグ
                        if (debugMode) {
                            const dirName = dx === 1 ? '右' : dx === -1 ? '左' : dy === 1 ? '下' : '上';
                            movementLog.push({
                                turn: turnCount,
                                pos: [x, y],
                                direction: dirName,
                                choosenDist,
                                maxDist,
                                actualDist,
                                blockPlaced: choosenDist < maxDist
                            });
                        }

                        // ブロック配置（選択距離が実最大距離より小さい場合）
                        if (choosenDist < maxDist) {
                            const blockX = x + dx * (choosenDist + 1);
                            const blockY = y + dy * (choosenDist + 1);
                            if (blockX >= 0 && blockX < N && blockY >= 0 && blockY < N) {
                                blocks.push([blockX, blockY]);
                                painted[blockY][blockX] = true; // ★修正：ブロック位置を「到達不可」として扱う
                            }
                        }

                        // ストーンを移動・塗りつぶし
                        for (let d = 1; d <= actualDist; d++) {
                            const nx = x + dx * d;
                            const ny = y + dy * d;
                            painted[ny][nx] = true;
                        }

                        x += dx * actualDist;
                        y += dy * actualDist;
                        moved = true;
                        turnCount++;
                        break; // 次のターンへ
                    }
                }

                if (!moved) break; // 全方向移動不可 → 終了
            }

            // 塗りつぶされていないマスをブロック化
            for (let yy = 0; yy < N; yy++) {
                for (let xx = 0; xx < N; xx++) {
                    if (!painted[yy][xx]) {
                        blocks.push([xx, yy]);
                    }
                }
            }

            // グリッド構築
            const gridArray = Array(N).fill().map(() => Array(N).fill(0));
            for (const [bx, by] of blocks) {
                if (bx >= 0 && bx < N && by >= 0 && by < N) {
                    gridArray[by][bx] = 1;
                }
            }

            const paintedCount = painted.flat().filter(p => p).length;
            return { grid: gridArray, painted, blockCount: blocks.length, movementLog, paintedCount, startPos };
        }

        // 指定した方向に滑る（ブロックか塗りつぶし領域にぶつかるまで）
        function slideInDirection(x, y, dx, dy, grid, painted) {
            const path = [];

            while (true) {
                const nextX = x + dx;
                const nextY = y + dy;

                // 境界チェック
                if (nextX < 0 || nextX >= N || nextY < 0 || nextY >= N) {
                    break;
                }

                // ブロック or 既に塗りつぶされたマスをチェック
                if (grid[nextY][nextX] === 1 || painted[nextY][nextX]) {
                    break;
                }

                x = nextX;
                y = nextY;
                path.push([x, y]);
            }

            return { endX: x, endY: y, path: path };
        }

        // 現在のマスから4方向に滑った時の結果を全て返す
        function getAllMoves(x, y, grid, painted) {
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            const moves = [];

            for (const [dx, dy] of directions) {
                const result = slideInDirection(x, y, dx, dy, grid, painted);
                if (result.path.length > 0) {
                    moves.push({
                        endX: result.endX,
                        endY: result.endY,
                        path: result.path,
                        dx: dx,
                        dy: dy
                    });
                }
            }

            return moves;
        }

        // DFSで全マスを塗りつぶす経路を探索
        function findSolutionPath() {
            const allMaps = Array(N).fill().map(() => Array(N).fill(false));
            allMaps[startPos[1]][startPos[0]] = true; // ★修正：スタート位置から開始
            const moves = [];

            function dfs(x, y, depth) {
                if (depth > 1000) return false;

                // 全マスが塗りつぶされたか確認
                let allPainted = true;
                for (let yy = 0; yy < N; yy++) {
                    for (let xx = 0; xx < N; xx++) {
                        if (grid[yy][xx] === 0 && !allMaps[yy][xx]) {
                            allPainted = false;
                            break;
                        }
                    }
                    if (!allPainted) break;
                }

                if (allPainted) return true;

                const possibleMoves = getAllMoves(x, y, grid, allMaps);

                for (const move of possibleMoves) {
                    let hasNewCell = false;
                    for (const [nx, ny] of move.path) {
                        if (!allMaps[ny][nx]) {
                            hasNewCell = true;
                            allMaps[ny][nx] = true;
                        }
                    }

                    if (hasNewCell) {
                        moves.push({
                            startX: x,
                            startY: y,
                            endX: move.endX,
                            endY: move.endY,
                            path: move.path,
                            direction: move.dx === 1 ? '右' : move.dx === -1 ? '左' : move.dy === 1 ? '下' : '上'
                        });

                        if (dfs(move.endX, move.endY, depth + 1)) {
                            return true;
                        }

                        for (const [nx, ny] of move.path) {
                            allMaps[ny][nx] = false;
                        }
                        moves.pop();
                    }
                }

                return false;
            }

            if (dfs(startPos[0], startPos[1], 0)) { // ★修正：スタート位置から探索開始
                return moves;
            }
            return null;
        }

        // グリッド描画
        function drawGrid() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const cellSize = canvas.width / N;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    if (grid[y][x] === 1) {
                        ctx.fillStyle = '#333';
                    } else if (painted[y][x]) {
                        ctx.fillStyle = '#e0e0e0';
                    } else {
                        ctx.fillStyle = '#fff';
                    }

                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }

            // スタート位置
            ctx.fillStyle = '#f00';
            ctx.fillRect(startPos[0] * cellSize, startPos[1] * cellSize, cellSize, cellSize);
            ctx.fillStyle = '#fff';
            ctx.font = `${cellSize * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('S', (startPos[0] + 0.5) * cellSize, (startPos[1] + 0.5) * cellSize);
        }

        // 矢印描画関数
        function drawArrow(ctx, fromX, fromY, toX, toY, cellSize, color = '#00f') {
            const headlen = cellSize * 0.25;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        // ステージ生成
        function generateStage() {
            N = parseInt(document.getElementById('gridSize').value);
            const seed = parseInt(document.getElementById('seed').value);
            const moveRangeMax = parseInt(document.getElementById('moveRangeMax').value);

            const result = generateStageViaSimulation(seed, N, moveRangeMax, true); // デバッグモードON
            grid = result.grid;
            painted = result.painted;
            startPos = result.startPos; // ★追加：スタート位置を保存

            drawGrid();
            const paintedCount = painted.flat().filter(p => p).length;
            
            // デバッグ情報を表示
            let debugInfo = `✓ ステージ生成成功 (スタート位置: (${result.startPos[0]},${result.startPos[1]}), ブロック数: ${result.blockCount}, 塗りつぶし: ${result.paintedCount}/${N*N})<br>`;
            debugInfo += `<strong>移動ログ:</strong><br>`;
            for (const log of result.movementLog) {
                debugInfo += `Turn ${log.turn}: (${log.pos[0]},${log.pos[1]}) → ${log.direction} | 選択距離: ${log.choosenDist}, 実最大: ${log.maxDist}, 実移動: ${log.actualDist}, ブロック配置: ${log.blockPlaced ? 'Yes' : 'No'}<br>`;
            }
            
            document.getElementById('status').innerHTML = `<div class="status success">${debugInfo}</div>`;
            document.getElementById('path').innerHTML = '';
            
            // コンソールにも出力
            console.log('Movement Log:', result.movementLog);
        }

        // 塗りつぶし経路を計算・表示
        function showSolution() {
            if (grid.length === 0) {
                alert('まずステージを生成してください。');
                return;
            }

            // **デバッグ：実際に到達可能なマスを計算**
            const actualReachable = Array(N).fill().map(() => Array(N).fill(false));
            actualReachable[startPos[1]][startPos[0]] = true; // ★修正：スタート位置から開始
            const queue = [[startPos[0], startPos[1]]];

            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const moves = getAllMoves(x, y, grid, actualReachable);

                for (const move of moves) {
                    for (const [nx, ny] of move.path) {
                        if (!actualReachable[ny][nx]) {
                            actualReachable[ny][nx] = true;
                            queue.push([nx, ny]);
                        }
                    }
                }
            }

            // ステージ生成時のpaintedと比較
            let unreachableMismatch = [];
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    if (grid[y][x] === 0) { // ブロックでない場合
                        if (painted[y][x] && !actualReachable[y][x]) {
                            unreachableMismatch.push([x, y]);
                        }
                    }
                }
            }

            if (unreachableMismatch.length > 0) {
                document.getElementById('status').innerHTML = `<div class="status error">✗ エラー: 到達不可のマスが存在 (${unreachableMismatch.length}個)<br>位置: ${unreachableMismatch.map(([x, y]) => `(${x},${y})`).join(', ')}</div>`;
                return;
            }

            document.getElementById('status').innerHTML = '<div class="status">計算中...</div>';

            setTimeout(() => {
                const solution = findSolutionPath();

                if (!solution) {
                    document.getElementById('status').innerHTML = '<div class="status error">✗ 解が見つかりません</div>';
                    return;
                }

                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');
                const cellSize = canvas.width / N;

                drawGrid();

                let moveCount = 0;
                for (const move of solution) {
                    const fromX = (move.startX + 0.5) * cellSize;
                    const fromY = (move.startY + 0.5) * cellSize;
                    const toX = (move.endX + 0.5) * cellSize;
                    const toY = (move.endY + 0.5) * cellSize;
                    drawArrow(ctx, fromX, fromY, toX, toY, cellSize, '#f00');
                    moveCount++;
                }

                let pathText = '<strong>移動経路:</strong><br>';
                for (let i = 0; i < solution.length; i++) {
                    const move = solution[i];
                    pathText += `${i + 1}. (${move.startX}, ${move.startY}) → ${move.direction} → (${move.endX}, ${move.endY})<br>`;
                }

                document.getElementById('status').innerHTML = `<div class="status success">✓ 解を発見 (${moveCount}手)</div>`;
                document.getElementById('path').innerHTML = pathText;
            }, 100);
        }

        // テスト実行
        function runTests() {
            const testCases = [
                { N: 4, moveRangeMax: 6 },
                { N: 5, moveRangeMax: 7 },
                { N: 6, moveRangeMax: 8 },
            ];

            const testCount = 10;
            const results = [];

            document.getElementById('status').innerHTML = '<div class="status">テスト実行中: 0/' + (testCases.length * testCount) + '</div>';
            document.getElementById('path').innerHTML = '';

            let testIndex = 0;
            let caseIndex = 0;

            function runNextTest() {
                if (caseIndex >= testCases.length) {
                    displayResults(results);
                    return;
                }

                const testCase = testCases[caseIndex];
                const { N: testN, moveRangeMax } = testCase;

                if (!results[caseIndex]) {
                    results[caseIndex] = { N: testN, moveRangeMax, blockCounts: [], paintedCounts: [] };
                }

                if (testIndex < testCount) {
                    const seed = 12345 + testIndex;
                    const result = generateStageViaSimulation(seed, testN, moveRangeMax, false); // デバッグモードOFF

                    results[caseIndex].blockCounts.push(result.blockCount);
                    results[caseIndex].paintedCounts.push(result.paintedCount);

                    testIndex++;
                    const totalDone = caseIndex * testCount + testIndex;
                    const totalTests = testCases.length * testCount;
                    document.getElementById('status').innerHTML = `<div class="status">テスト実行中: ${totalDone}/${totalTests}</div>`;

                    setTimeout(runNextTest, 10);
                } else {
                    testIndex = 0;
                    caseIndex++;
                    setTimeout(runNextTest, 10);
                }
            }

            runNextTest();
        }

        function displayResults(results) {
            let resultHtml = '<div class="status"><strong>テスト結果:</strong><br>';
            resultHtml += '<table style="margin: auto; border-collapse: collapse; font-size: 12px;">';
            resultHtml += '<tr style="border-bottom: 1px solid #ccc;"><th style="padding: 5px; border: 1px solid #ccc;">グリッド</th><th style="padding: 5px; border: 1px solid #ccc;">移動範囲</th><th style="padding: 5px; border: 1px solid #ccc;">平均ブロック</th><th style="padding: 5px; border: 1px solid #ccc;">平均塗りつぶし</th></tr>';

            for (const result of results) {
                const avgBlocks = (result.blockCounts.reduce((a, b) => a + b, 0) / result.blockCounts.length).toFixed(1);
                const avgPainted = (result.paintedCounts.reduce((a, b) => a + b, 0) / result.paintedCounts.length).toFixed(1);
                resultHtml += `<tr style="background-color: #d4edda; border-bottom: 1px solid #ccc;">`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${result.N}x${result.N}</td>`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${result.moveRangeMax}</td>`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${avgBlocks}</td>`;
                resultHtml += `<td style="padding: 5px; border: 1px solid #ccc;">${avgPainted}</td>`;
                resultHtml += '</tr>';
            }

            resultHtml += '</table></div>';
            document.getElementById('status').innerHTML = resultHtml;
        }

        window.onload = () => {
            document.getElementById('status').innerHTML = '';
        };
    </script>
</body>
</html>
